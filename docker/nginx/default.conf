server {
    listen 80;
    listen [::]:80;

    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    charset utf-8;
    server_tokens off;

    # Logs go to the nginx image defaults (stdout/stderr), i.e. "docker compose logs nginx".
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded files live on the public disk (public/storage after "php artisan storage:link").
    location /storage/ {
        try_files $uri =404;
        access_log off;
        expires max;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    # Static assets are served directly by nginx.
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|xml|webp)$ {
        access_log off;
        expires max;
    }

    location ~ /\. {
        deny all;
    }
}
