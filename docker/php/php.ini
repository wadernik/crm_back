; Minimal PHP settings for the application image.
; Timezone stays UTC: the database stores UTC and localisation happens at the
; application edge (owner decision Q24).

date.timezone = UTC

memory_limit = 256M

error_reporting = E_ALL
display_errors = Off
log_errors = On

expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamp = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
